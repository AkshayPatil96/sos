version: '3.9'

services:
  api:
    build:
      context: .
      target: deps
    command: pnpm dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '3000:3000'
      - '9229:9229'
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-student_user}:${DB_PASSWORD:-student_pass}@postgres:5432/${DB_NAME:-student_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-student_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-student_pass}
      POSTGRES_DB: ${DB_NAME:-student_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-student_user} -d ${DB_NAME:-student_db}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
