name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy (optional)'
        required: false
        type: string

env:
  ECR_REPOSITORY: student-api
  ECS_CLUSTER: student-onboarding-production
  ECS_SERVICE: student-api

jobs:
  deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Derive version tag from commit
        id: version
        run: |
          # Use short SHA + timestamp as version tag
          VERSION_TAG="prod-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:8}"
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Build, tag, and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build --target production \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.tag }} \
            -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:prod-latest \
            .
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.tag }}
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:prod-latest

      - name: Deploy to ECS
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Deployment summary
        run: |
          echo "Deployed to production: ${{ github.ref_name }} (${{ github.sha }})"
          echo "Version tag: ${{ steps.version.outputs.tag }}"
          echo "Image: $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.tag }}"
          echo "Previous SHA on prod-latest: $(git rev-parse HEAD~1)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual deploy reason: ${{ inputs.reason }}"
          fi
