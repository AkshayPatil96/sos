name: Deploy to Staging

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Push to ECR, Deploy to ECS
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build, tag, and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --target production -t $ECR_REGISTRY/student-api:$IMAGE_TAG .
          docker push $ECR_REGISTRY/student-api:$IMAGE_TAG
          docker tag $ECR_REGISTRY/student-api:$IMAGE_TAG $ECR_REGISTRY/student-api:latest
          docker push $ECR_REGISTRY/student-api:latest

      - name: Deploy to ECS
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ecs update-service \
            --cluster student-onboarding-staging \
            --service student-api \
            --force-new-deployment \
            --region $AWS_REGION
